<!-- TALLER TOYS 0.6 — output.html -->
<!-- § - Dedicated projection window: program players and sample pool · HTML -->
<!-- Taller Dev 2026 -->
<!-- VAI CORINTHIANS! -->
<!-- ──────────────────────────────────────────── -->
<meta charset="utf-8">
<title>Taller VJ — OUTPUT</title>

<!-- ── § 1 — STYLE — Bus chain, frame, sample layer ── -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;cursor:none}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#frame{position:relative;overflow:hidden;background:#000;
  aspect-ratio:var(--ar,16/9);max-width:100%;max-height:100%;width:100%}
.bus{position:absolute;inset:0}
.layer{position:absolute;inset:0}
.samp{position:absolute;inset:0;opacity:0;transition:opacity var(--sfade,90ms) linear}
iframe{position:absolute;left:50%;top:50%;border:0;pointer-events:none;
  width:var(--covw,100%);height:var(--covh,100%);
  transform:translate(-50%,-50%) scale(var(--zoom,1))}
#hint{position:absolute;left:0;right:0;bottom:0;padding:10px;text-align:center;
  font:11px system-ui;color:#666;background:#000a;transition:opacity .4s}
@keyframes glitch{
  0%{transform:translate(0)}
  20%{transform:translate(calc(var(--g,1)*-7px),calc(var(--g,1)*2px))}
  40%{transform:translate(calc(var(--g,1)*6px),calc(var(--g,1)*-4px))}
  60%{transform:translate(calc(var(--g,1)*-4px),calc(var(--g,1)*-2px))}
  80%{transform:translate(calc(var(--g,1)*5px),calc(var(--g,1)*3px))}
  100%{transform:translate(0)}}
@keyframes hueroll{from{filter:hue-rotate(0)}to{filter:hue-rotate(360deg)}}
@keyframes strobe{0%,49%{opacity:1}50%,100%{opacity:var(--s,.05)}}
</style>

<!-- ── § 2 — MARKUP — Program chain with sample layer on top ── -->
<div id="stage"><div id="frame">
  <div class="bus" id="hueM"><div class="bus" id="baseM"><div class="bus" id="animM">
    <div class="layer" id="pgA">
      <div class="bus" id="hueA"><div class="bus" id="baseA"><div class="bus" id="animA">
        <div id="ytAout"></div></div></div></div></div>
    <div class="layer" id="pgB">
      <div class="bus" id="hueB"><div class="bus" id="baseB"><div class="bus" id="animB">
        <div id="ytBout"></div></div></div></div></div>
    <div class="layer" id="pgS">
      <div class="samp" id="s0"><div id="ytS0"></div></div>
      <div class="samp" id="s1"><div id="ytS1"></div></div>
      <div class="samp" id="s2"><div id="ytS2"></div></div>
      <div class="samp" id="s3"><div id="ytS3"></div></div>
    </div>
  </div></div></div>
</div></div>
<div id="hint">SAÍDA — arraste esta janela para o projetor e aperte F11 · o controle fica na outra janela</div>

<!-- ── § 3 — LOGIC — Command surface for the controller ── -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const P={}, SP=[], ST={xf:0,cc:false,loop:true,ar:'16/9',zoom:1,svol:0,
  opA:1,opB:1,hasA:false,hasB:false};
const el=id=>document.getElementById(id);
const NSAMP=4;

function mk(id,deck){
  return new YT.Player(id,{height:'100%',width:'100%',videoId:'',
    playerVars:{controls:0,disablekb:1,modestbranding:1,rel:0,iv_load_policy:3,
      playsinline:1,cc_load_policy:0},
    events:{
      onReady:e=>{ try{e.target.setLoop(ST.loop)}catch(err){} },
      onStateChange:e=>{
        if(e.data===YT.PlayerState.PLAYING&&!ST.cc) ccOff(e.target);
        if(e.data===YT.PlayerState.ENDED&&deck){
          if(ST.loop){ try{e.target.seekTo(0,true);e.target.playVideo();}catch(err){} }
          if(VJ.onEnded) VJ.onEnded(deck);
        }
      }}});
}
function onYouTubeIframeAPIReady(){
  P.A=mk('ytAout','A'); P.B=mk('ytBout','B');
  // pool de samples: ficam carregados e pausados no ponto de entrada,
  // porque carregar no momento do disparo levaria segundos
  for(let i=0;i<NSAMP;i++){
    SP[i]=new YT.Player('ytS'+i,{height:'100%',width:'100%',videoId:'',
      playerVars:{controls:0,disablekb:1,modestbranding:1,rel:0,iv_load_policy:3,
        playsinline:1,cc_load_policy:0},
      events:{onReady:e=>{e.target.mute();e.target.setVolume(0);ccOff(e.target);}}});
  }
  VJ.ready=true;
}
if(window.YT&&YT.Player) onYouTubeIframeAPIReady();

function ccOff(p){
  if(!p||!p.unloadModule) return;
  try{ p.setOption('captions','track',{}); }catch(e){}
  try{ ['captions','cc'].forEach(m=>p.unloadModule(m)); }catch(e){}
}

/* ── § 3.1 — VJ — the surface the controller drives ── */
const VJ=window.VJ={
  ready:false, onEnded:null,

  load(d,id){ if(P[d]) P[d].loadVideoById(id); },
  loadList(d,list){ if(P[d]) P[d].loadPlaylist({list,listType:'playlist'}); },
  play(d){ try{P[d].playVideo()}catch(e){} },
  pause(d){ try{P[d].pauseVideo()}catch(e){} },
  toggle(d){ try{ P[d].getPlayerState()===1?P[d].pauseVideo():P[d].playVideo(); }catch(e){} },
  seek(d,t){ try{P[d].seekTo(t,true)}catch(e){} },
  time(d){ try{return P[d].getCurrentTime()}catch(e){return 0} },
  duration(d){ try{return P[d].getDuration()}catch(e){return 0} },
  state(d){ try{return P[d].getPlayerState()}catch(e){return -1} },
  vol(d,v){ try{P[d].setVolume(Math.round(v))}catch(e){} },

  // crossfader faz a mistura; a opacidade de canal é um ganho por cima dela
  xf(v){ ST.xf=v; VJ.paint(); },
  opacity(d,v){ ST['op'+d]=v; VJ.paint(); },
  present(d,b){ ST['has'+d]=!!b; VJ.paint(); },
  // a saída é o monitor conjunto de A e B: o crossfader só arbitra quando os dois
  // têm sinal. Com um deck só, ele aparece inteiro, onde quer que o fader esteja.
  paint(){
    const a=ST.hasA, b=ST.hasB;
    let oa=0, ob=0;
    if(a&&b){ oa=ST.opA; ob=ST.opB*ST.xf/100; }
    else if(a){ oa=ST.opA; }
    else if(b){ ob=ST.opB; }
    el('pgA').style.opacity=oa.toFixed(3);
    el('pgB').style.opacity=ob.toFixed(3);
  },
  sampZoom(z){ el('pgS').style.setProperty('--zoom',z); },
  smooth(ms){ el('pgB').style.transition=`opacity ${ms}ms linear`; },
  blend(m){ el('pgB').style.mixBlendMode=m; },

  /* samples — pool pré-carregado, disparo momentâneo */
  sampLoad(i,id,tin){
    const p=SP[i]; if(!p||!p.loadVideoById) return;
    p.loadVideoById({videoId:id,startSeconds:tin||0});
    p.mute();
    // o load dá play automático: deixamos pausado no ponto de entrada
    setTimeout(()=>{ try{p.seekTo(tin||0,true);p.pauseVideo();}catch(e){} },1100);
  },
  sampOn(i){ const p=SP[i]; if(!p) return;
    try{
      if(ST.svol>0){ p.unMute(); p.setVolume(ST.svol); } else p.mute();
      p.playVideo();
    }catch(e){}
    el('s'+i).style.opacity=1; },
  sampOff(i,tin){ const p=SP[i]; if(!p) return;
    el('s'+i).style.opacity=0;
    try{ p.mute(); p.pauseVideo(); p.seekTo(tin||0,true); }catch(e){} },
  // volume dos samples: 0 mantém tudo mudo, como antes
  sampVol(v){ ST.svol=v; SP.forEach(p=>{ try{
    if(v>0){ p.unMute(); p.setVolume(v); } else p.mute(); }catch(e){} }); },
  sampTime(i){ try{return SP[i].getCurrentTime()}catch(e){return 0} },
  sampSeek(i,t){ try{SP[i].seekTo(t,true)}catch(e){} },
  sampBlend(m){ el('pgS').style.mixBlendMode=m; },
  // fade 0 remove a transição por completo: transição em janela oculta congela,
  // e o disparo momentâneo não pode depender disso
  sampFade(ms){
    document.documentElement.style.setProperty('--sfade',ms+'ms');
    for(let i=0;i<NSAMP;i++) el('s'+i).style.transition = ms>0 ? '' : 'none';
  },

  // espelha um bus de efeito vindo do controlador
  bus(b,names,k){
    const set=new Set(names), f=[];
    if(set.has('invert')) f.push(`invert(${k})`);
    if(set.has('melt'))   f.push(`blur(${(k*7).toFixed(1)}px) contrast(${(1+k*2.4).toFixed(2)}) saturate(${(1+k).toFixed(2)})`);
    el('base'+b).style.filter=f.join(' ');
    el('hue'+b).style.animation = set.has('hue') ? `hueroll ${(6.5-k*5.5).toFixed(2)}s linear infinite` : '';
    const a=[], an=el('anim'+b);
    if(set.has('glitch')){ an.style.setProperty('--g',k); a.push('glitch .18s steps(2) infinite'); }
    if(set.has('strobe')){ an.style.setProperty('--s',(1-k*.95).toFixed(3)); a.push('strobe .11s steps(1) infinite'); }
    an.style.animation=a.join(', ');
  },

  // zoom por canal: a var vive na camada e é herdada pelo iframe daquele deck
  zoomCh(d,z){ el('pg'+d).style.setProperty('--zoom',z); },

  frame(ar,zoom){
    ST.ar=ar; ST.zoom=zoom;
    const [w,h]=ar.split('/').map(Number), T=w/h, SRC=16/9, r=document.documentElement.style;
    r.setProperty('--ar',ar);
    if(T<SRC){ r.setProperty('--covh','100%'); r.setProperty('--covw',(SRC/T*100).toFixed(2)+'%'); }
    else     { r.setProperty('--covw','100%'); r.setProperty('--covh',(T/SRC*100).toFixed(2)+'%'); }
    r.setProperty('--zoom',zoom);
  },

  loop(b){ ST.loop=b; ['A','B'].forEach(d=>{try{P[d].setLoop(b)}catch(e){}}); },
  cc(b){ ST.cc=b;
    ['A','B'].forEach(d=>{ const p=P[d]; if(!p) return;
      if(b){ try{['captions','cc'].forEach(m=>p.loadModule(m))}catch(e){} } else ccOff(p); }); }
};

setTimeout(()=>{el('hint').style.opacity=0;},6000);
addEventListener('keydown',e=>{ if(e.key==='F11') return; if(window.opener) window.opener.focus(); });
</script>
