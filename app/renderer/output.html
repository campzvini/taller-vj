<meta charset="utf-8">
<title>Taller VJ — OUTPUT</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;cursor:none}
  #stage{position:absolute;inset:0}
  #pgA{position:absolute;inset:0;transition:opacity 60ms linear}
  iframe{width:100%;height:100%;border:0;pointer-events:none}
  #hud{position:absolute;left:0;right:0;bottom:0;padding:8px;text-align:center;
    font:11px system-ui;color:#4a4a55;background:#000a}
</style>

<div id="stage"><div id="pgA"><div id="ytA"></div></div></div>
<div id="hud">OUTPUT — spike</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const P={};
function onYouTubeIframeAPIReady(){
  P.A=new YT.Player('ytA',{height:'100%',width:'100%',videoId:'',
    playerVars:{controls:0,disablekb:1,modestbranding:1,rel:0,iv_load_policy:3,
      playsinline:1,cc_load_policy:0},
    events:{onReady:()=>{VJ.ready=true;}}});
}
if(window.YT&&YT.Player) onYouTubeIframeAPIReady();

const VJ=window.VJ={
  ready:false,
  load(d,id){ try{P[d].loadVideoById(id)}catch(e){} },
  state(d){ try{return P[d].getPlayerState()}catch(e){return -1} },
  data(d){ try{return P[d].getVideoData()}catch(e){return null} },
  xf(v){ document.getElementById('pgA').style.opacity=(v/100).toFixed(3);
         window.__lastXf=v; document.getElementById('hud').textContent='xf '+v; }
};

// mesma origem nas duas janelas: o canal é memória, sem passar pelo main
const bus=window.__bus=new BroadcastChannel('vj');
bus.onmessage=e=>{
  const m=e.data||{};
  if(m.cmd==='xf') VJ.xf(m.v);
  if(m.cmd==='load') VJ.load(m.deck,m.id);
};
</script>
